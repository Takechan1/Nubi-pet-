<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NUBI SAFE — Alta de mascota</title>
<style>
:root{--navy:#07152f;--blue:#08a9e8;--bg:#eef5fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--navy)}.wrap{max-width:760px;margin:auto;padding:24px}.brand{font-weight:950;font-size:22px;margin-bottom:20px}.card{background:#fff;border:1px solid #dce8f3;border-radius:24px;padding:28px;box-shadow:0 20px 60px #12395c18}label{display:block;font-size:12px;font-weight:900;margin:15px 0 7px}input,select,textarea{width:100%;padding:13px;border:1px solid #d5e0eb;border-radius:12px;font:inherit}textarea{min-height:90px}.btn{margin-top:20px;border:0;border-radius:13px;padding:14px 18px;background:var(--navy);color:#fff;font-weight:950;width:100%;cursor:pointer}.result{display:none;margin-top:20px;padding:18px;border-radius:15px;background:#eaf8ff;border:1px solid #cceeff}.result.show{display:block}.small{font-size:12px;color:#718198;line-height:1.5}.qr{margin:18px auto;width:180px;height:180px;display:grid;place-items:center;background:#fff;border:1px solid #dce8f3;border-radius:16px}.qr img{max-width:150px}.link{word-break:break-all;color:#087ba9;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">🐾 NUBI PET · NUBI SAFE</div>
<div class="card">
<h1>Crear perfil de mascota</h1>
<p class="small">Prototipo local. Acá generamos los datos que después conectaremos a Firebase y a un QR físico único.</p>
<form id="form">
<label>Nombre de la mascota</label><input id="name" required placeholder="Firulais">
<label>Tipo</label><select id="type"><option>Perro</option><option>Gato</option><option>Otro</option></select>
<label>Nombre del dueño</label><input id="owner" required placeholder="Nombre">
<label>WhatsApp del dueño</label><input id="phone" required placeholder="+54 9 11 1234-5678">
<label>Color / descripción</label><input id="color" placeholder="Dorado">
<label>Información importante</label><textarea id="notes" placeholder="Alergias, cuidados, etc."></textarea>
<button class="btn">Generar NUBI SAFE</button>
</form>
<div class="result" id="result">
<strong>Perfil generado</strong>
<div class="qr"><img id="qr" alt="QR del perfil"></div>
<div class="link" id="profileLink"></div>
<p class="small">En producción, este enlace será una URL pública permanente de NUBI PET y el QR se grabará en la chapita.</p>
</div>
</div>
</div>
<script>
document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();
 const id="NUBI-"+Math.random().toString(36).slice(2,7).toUpperCase();
 const data={id,name:name.value,type:type.value,owner:owner.value,phone:phone.value,color:color.value,notes:notes.value};
 localStorage.setItem("nubi:"+id,JSON.stringify(data));
 const link=location.origin+location.pathname.replace("admin.html","index.html")+"?id="+encodeURIComponent(id);
 document.getElementById("profileLink").textContent=link;
 document.getElementById("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(link);
 document.getElementById("result").classList.add("show");
});
</script>
</body>
</html>
